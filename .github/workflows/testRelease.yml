name: Test Release

on:
  push:
    branches:
      - master
      - next
      - next-major
      - alpha
      - beta
      - 'feat/**'
      - 'fix/**'
      - 'perf/**'
      - 'refactor/**'

  schedule:
    - cron: 0 2 * * 0

permissions:
  contents: read

jobs:
  test-semantic-latest:
    name: test-semantic-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Semantic Release
        uses: ./
        id: semantic
        with:
          dry_run: true
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'master',
              'next',
              'next-major',
              {
                name: 'beta',
                prerelease: true
              },
              {
                name: 'alpha',
                prerelease: true
              }
            ]
          branch: master
          extra_plugins: |
            @semantic-release/git
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Test Outputs
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          NEW_RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          NEW_RELEASE_MAJOR_VERSION: ${{ steps.semantic.outputs.new_release_major_version }}
          NEW_RELEASE_MINOR_VERSION: ${{ steps.semantic.outputs.new_release_minor_version }}
          NEW_RELEASE_PATCH_VERSION: ${{ steps.semantic.outputs.new_release_patch_version }}
        run: |
          echo "$NEW_RELEASE_VERSION"
          echo "$NEW_RELEASE_MAJOR_VERSION"
          echo "$NEW_RELEASE_MINOR_VERSION"
          echo "$NEW_RELEASE_PATCH_VERSION"

  test-semantic-v15:
    name: test-semantic-v15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Semantic Release
        uses: ./
        id: semantic
        with:
          semantic_version: 15
          dry_run: true
          branches: |
            [
              'master',
              {name: 'beta', prerelease: true},
              {name: 'alpha', prerelease: true}
            ]
          branch: master
          extra_plugins: |
            @semantic-release/git@7
            @semantic-release/changelog@3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Test Outputs
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          NEW_RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          NEW_RELEASE_MAJOR_VERSION: ${{ steps.semantic.outputs.new_release_major_version }}
          NEW_RELEASE_MINOR_VERSION: ${{ steps.semantic.outputs.new_release_minor_version }}
          NEW_RELEASE_PATCH_VERSION: ${{ steps.semantic.outputs.new_release_patch_version }}
        run: |
          echo "$NEW_RELEASE_VERSION"
          echo "$NEW_RELEASE_MAJOR_VERSION"
          echo "$NEW_RELEASE_MINOR_VERSION"
          echo "$NEW_RELEASE_PATCH_VERSION"
