name: Test semantic_version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: release
        uses: .
        continue-on-error: true
        with:
          semantic_version: '21'
          dry_run: 'true'
          ci: 'false'
          branches: 'act-harness'
          skip_npm_plugin: 'true'

      - name: Assert action ran with pinned semantic_version (sentinel repo may cause graceful failure)
        env:
          OUTCOME: ${{ steps.release.outcome }}
          NEW_RELEASE: ${{ steps.release.outputs.new_release_published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_release_published: $NEW_RELEASE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with semantic_version=21"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
