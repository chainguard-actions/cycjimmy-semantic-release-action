name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sr-workdir"
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          ci: 'false'
          skip_npm_plugin: 'true'
          working_directory: './sr-workdir'
      - name: Assert action ran (working_directory input accepted, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.new_release_published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_release_published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with working_directory input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
