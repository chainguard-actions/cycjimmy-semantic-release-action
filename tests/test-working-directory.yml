name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create working directory with package.json
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-subproject"
          cat > "$GITHUB_WORKSPACE/my-subproject/package.json" << 'EOF'
          {
            "name": "my-subproject",
            "version": "0.0.0-development",
            "release": {
              "branches": ["act-harness"]
            }
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          working_directory: './my-subproject'
          dry_run: 'true'
          ci: 'false'
      - name: Assert action ran with working_directory input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.new_release_published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_release_published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with working_directory input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
