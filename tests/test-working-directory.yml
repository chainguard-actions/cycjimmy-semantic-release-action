name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with minimal package.json
        run: |
          mkdir -p /tmp/sr-workdir
          cat > /tmp/sr-workdir/package.json <<'EOF'
          {
            "name": "test-package",
            "version": "0.0.0-development",
            "description": "Test package for semantic-release"
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          working_directory: '/tmp/sr-workdir'
          dry_run: 'true'
          ci: 'false'
      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with working_directory input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
