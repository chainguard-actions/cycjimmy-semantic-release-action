name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a subdirectory to use as working directory
        run: mkdir -p "$GITHUB_WORKSPACE/subproject"
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: 'true'
          working_directory: './subproject'
          branches: 'act-harness'
      - name: Assert action ran with working_directory input (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NEW_RELEASE: ${{ steps.action.outputs.new_release_published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_release_published: $NEW_RELEASE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable or no package.json in subdir)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
