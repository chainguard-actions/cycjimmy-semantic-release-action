name: Test extends with a local shareable config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a scratch git repo with a shareable config file
        run: |
          set -e
          REPO=/tmp/sr-extends/repo
          REMOTE=/tmp/sr-extends/remote.git
          rm -rf /tmp/sr-extends
          mkdir -p /tmp/sr-extends
          git init -q --bare "$REMOTE"
          git --git-dir="$REMOTE" symbolic-ref HEAD refs/heads/main
          git init -q "$REPO"
          cd "$REPO"
          git checkout -q -b main
          git config user.email "test@example.com"
          git config user.name "Test User"
          cat > shared-config.cjs <<'EOF'
          module.exports = {
            tagFormat: 'shared-v${version}',
            plugins: [
              '@semantic-release/commit-analyzer',
              '@semantic-release/release-notes-generator'
            ]
          };
          EOF
          git add shared-config.cjs
          git commit -q -m "chore: initial commit"
          echo "hello" > feature.txt
          git add feature.txt
          git commit -q -m "feat: add a feature"
          git remote add origin "$REMOTE"
          git push -q origin main
      - id: release
        uses: .
        with:
          working_directory: /tmp/sr-extends/repo
          repository_url: file:///tmp/sr-extends/remote.git
          branches: main
          dry_run: 'true'
          unset_gha_env: 'true'
          extends: ./shared-config.cjs
      - name: Assert the shared config tagFormat was applied
        env:
          PUBLISHED: ${{ steps.release.outputs.new_release_published }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
          TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          echo "published=$PUBLISHED version=$VERSION tag=$TAG"
          fail=0
          [ "$PUBLISHED" = "true" ] || { echo "FAIL: new_release_published should be true"; fail=1; }
          [ "$VERSION" = "1.0.0" ] || { echo "FAIL: version should be 1.0.0"; fail=1; }
          [ "$TAG" = "shared-v1.0.0" ] || { echo "FAIL: tag should be shared-v1.0.0 (from extended config)"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "PASS"
