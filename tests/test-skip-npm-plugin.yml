name: Test skip-npm-plugin option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: 'true'
          ci: 'false'
          skip_npm_plugin: 'true'
          branches: 'act-harness'

      - name: Assert action ran with skip_npm_plugin (sentinel repo may cause API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NEW_RELEASE: ${{ steps.action.outputs.new_release_published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_release_published: $NEW_RELEASE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skip_npm_plugin=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
