name: Test invalid semantic_version input is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a scratch git repo
        run: |
          set -e
          REPO=/tmp/sr-invalid/repo
          rm -rf /tmp/sr-invalid
          mkdir -p "$REPO"
          cd "$REPO"
          git init -q
          git checkout -q -b main
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo '{"plugins": ["@semantic-release/commit-analyzer"]}' > .releaserc.json
          git add .releaserc.json
          git commit -q -m "feat: initial"
      - id: release
        uses: .
        continue-on-error: true
        with:
          working_directory: /tmp/sr-invalid/repo
          semantic_version: '24; echo pwned'
          dry_run: 'true'
          unset_gha_env: 'true'
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.release.outcome }}
          PUBLISHED: ${{ steps.release.outputs.new_release_published }}
        run: |
          echo "outcome: $OUTCOME published='$PUBLISHED'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on an invalid semantic_version"
            exit 1
          fi
          if [ "$PUBLISHED" = "true" ]; then
            echo "FAIL: new_release_published must not be true on failure"
            exit 1
          fi
          echo "PASS"
