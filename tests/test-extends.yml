name: Test extends input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal shareable config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-config"
          cat > "$GITHUB_WORKSPACE/release-config/index.js" << 'EOF'
          module.exports = {
            branches: ['act-harness'],
            plugins: [
              '@semantic-release/commit-analyzer',
              '@semantic-release/release-notes-generator'
            ]
          };
          EOF
          cat > "$GITHUB_WORKSPACE/release-config/package.json" << 'EOF'
          {
            "name": "local-release-config",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          extends: './release-config'
          dry_run: 'true'
          ci: 'false'
      - name: Assert action ran with extends input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PUBLISHED: ${{ steps.action.outputs.new_release_published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_release_published: $PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with extends input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or config resolution)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
