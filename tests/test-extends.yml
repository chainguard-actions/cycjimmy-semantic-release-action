name: Test extends input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a local shareable config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.release-config"
          cat > "$GITHUB_WORKSPACE/.release-config/index.js" << 'EOF'
          module.exports = {
            branches: ['act-harness'],
            plugins: [
              '@semantic-release/commit-analyzer',
              '@semantic-release/release-notes-generator',
            ],
          };
          EOF
          cat > "$GITHUB_WORKSPACE/.release-config/package.json" << 'EOF'
          {
            "name": "local-release-config",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          extends: './.release-config'
          dry_run: 'true'
          ci: 'false'
          branches: 'act-harness'
          skip_npm_plugin: 'true'
      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NEW_RELEASE_PUBLISHED: ${{ steps.action.outputs.new_release_published }}
        run: |
          echo "outcome: $OUTCOME"
          echo "new_release_published: $NEW_RELEASE_PUBLISHED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with extends, new_release_published='$NEW_RELEASE_PUBLISHED'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
