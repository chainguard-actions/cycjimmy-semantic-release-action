name: Test extends input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          extends: semantic-release-monorepo
          dry_run: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action completed
        env:
          NEW_RELEASE_PUBLISHED: ${{ steps.action.outputs.new_release_published }}
        run: |
          echo "new_release_published: $NEW_RELEASE_PUBLISHED"
          echo "PASS: extends input accepted and action completed"
