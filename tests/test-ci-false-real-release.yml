name: Test ci=false performs a real release to a local remote
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a scratch git repo with a local bare remote
        id: setup
        run: |
          set -e
          REPO=/tmp/sr-ci/repo
          REMOTE=/tmp/sr-ci/remote.git
          rm -rf /tmp/sr-ci
          mkdir -p /tmp/sr-ci
          git init -q --bare "$REMOTE"
          git --git-dir="$REMOTE" symbolic-ref HEAD refs/heads/main
          git init -q "$REPO"
          cd "$REPO"
          git checkout -q -b main
          git config user.email "test@example.com"
          git config user.name "Test User"
          cat > .releaserc.json <<'EOF'
          {
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator"
            ]
          }
          EOF
          git add .releaserc.json
          git commit -q -m "chore: initial commit"
          echo "hello" > feature.txt
          git add feature.txt
          git commit -q -m "feat: add a feature"
          git remote add origin "$REMOTE"
          git push -q origin main
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: release
        uses: .
        with:
          working_directory: /tmp/sr-ci/repo
          repository_url: file:///tmp/sr-ci/remote.git
          branches: main
          ci: 'false'
          unset_gha_env: 'true'
      - name: Assert a 1.0.0 release was published
        env:
          PUBLISHED: ${{ steps.release.outputs.new_release_published }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
          TAG: ${{ steps.release.outputs.new_release_git_tag }}
          HEAD_SHA: ${{ steps.release.outputs.new_release_git_head }}
          EXPECTED_HEAD: ${{ steps.setup.outputs.head }}
        run: |
          echo "published=$PUBLISHED version=$VERSION tag=$TAG head=$HEAD_SHA expected=$EXPECTED_HEAD"
          fail=0
          [ "$PUBLISHED" = "true" ] || { echo "FAIL: new_release_published should be true"; fail=1; }
          [ "$VERSION" = "1.0.0" ] || { echo "FAIL: version should be 1.0.0"; fail=1; }
          [ "$TAG" = "v1.0.0" ] || { echo "FAIL: tag should be v1.0.0"; fail=1; }
          [ "$HEAD_SHA" = "$EXPECTED_HEAD" ] || { echo "FAIL: git_head mismatch"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "PASS"
      - name: Assert the tag was pushed to the remote (not a dry run)
        run: |
          TAGS="$(git ls-remote --tags /tmp/sr-ci/remote.git)"
          echo "remote tags: $TAGS"
          if ! echo "$TAGS" | grep -q "refs/tags/v1.0.0"; then
            echo "FAIL: v1.0.0 tag not found on remote"
            exit 1
          fi
          echo "PASS"
